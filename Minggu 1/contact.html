<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Alya Nadhira</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="index.html" class="logo">AlyaNadhira</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a class="active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <div class="contact-heading reveal">
        <p>Get in touch</p>
        <h1>Let's Connect</h1>
        <p>Silakan hubungi saya apabila ingin berdiskusi, berkolaborasi, atau memiliki pertanyaan dengan mengirimkan pesan melalui form di bawah ini.</p>
      </div>

      <form class="contact-form reveal delay-1">
        <div class="form-row">
          <div class="form-group"><label for="name">Nama Lengkap</label><input type="text" id="name" name="name" placeholder="Masukkan nama lengkap" required></div>
          <div class="form-group"><label for="email">Alamat Email</label><input type="email" id="email" name="email" placeholder="Masukkan email" required></div>
        </div>

        <div class="form-group">
          <label for="category">Kategori/Keperluan</label>
          <select id="category" name="category" required>
            <option value="">Pilih kategori</option>
            <option value="konsultasi">Konsultasi</option>
            <option value="kolaborasi">Kolaborasi Proyek</option>
            <option value="pertanyaan">Pertanyaan Umum</option>
          </select>
        </div>

        <div class="form-group"><label for="message">Pesan</label><textarea id="message" name="message" rows="6" placeholder="Masukkan pesan" required></textarea></div>
        <button type="submit" class="submit-button">Kirim Pesan →</button>
      </form>
    </section>
  </main>

  <footer class="big-footer">
    <div class="footer-bottom">
      <p>© 2026 Alya Nadhira. All rights reserved.</p>
      <div class="footer-links">
        <a href="https://www.linkedin.com/in/alyanadhira2/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.instagram.com/dhira_alyaa" target="_blank" rel="noopener">Instagram</a>
        <a href="https://github.com/dhiraalya" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
